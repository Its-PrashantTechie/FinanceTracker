<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Personal Finance Tracker</h1>
            <p class="subtitle">Track your income and expenses effortlessly</p>
        </header>

        <!-- Add Transaction Form -->
        <section class="card">
            <h2>Add Transaction</h2>
            <form id="addTransactionForm">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="text" id="date" name="date" value="{{ today_date }}" placeholder="DD-MM-YYYY" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="Enter amount" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" id="description" name="description" placeholder="Enter description">
                </div>
                <button type="submit" class="btn btn-primary">Add Transaction</button>
            </form>
        </section>

        <!-- View Transactions -->
        <section class="card">
            <h2>View Transactions</h2>
            <div class="date-filters">
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input type="text" id="startDate" name="startDate" placeholder="DD-MM-YYYY" required>
                </div>
                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <input type="text" id="endDate" name="endDate" placeholder="DD-MM-YYYY" required>
                </div>
                <button id="viewTransactions" class="btn btn-secondary">View Transactions</button>
            </div>
        </section>

        <!-- Summary Cards -->
        <section class="summary-section" id="summarySection" style="display: none;">
            <div class="summary-card income">
                <h3>Total Income</h3>
                <p id="totalIncome">₹0.00</p>
            </div>
            <div class="summary-card expense">
                <h3>Total Expense</h3>
                <p id="totalExpense">₹0.00</p>
            </div>
            <div class="summary-card balance">
                <h3>Net Balance</h3>
                <p id="netBalance">₹0.00</p>
            </div>
        </section>

        <!-- Transactions Table -->
        <section class="card" id="transactionsSection" style="display: none;">
            <h2>Transactions</h2>
            <div class="table-container">
                <table id="transactionsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody id="transactionsBody">
                    </tbody>
                </table>
            </div>
            <button id="showPlot" class="btn btn-tertiary">Show Plot</button>
        </section>

        <!-- Plot Section -->
        <section class="card" id="plotSection" style="display: none;">
            <h2>Income vs Expense Chart</h2>
            <div id="plotContainer">
                <img id="plotImage" src="" alt="Income vs Expense Plot">
            </div>
        </section>

        <!-- Notification -->
        <div id="notification" class="notification"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
